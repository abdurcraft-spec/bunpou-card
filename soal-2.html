<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JLPT N4 Bunpou - Materi 2</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="style-soal.css" />
  </head>
  <body class="quiz-page locked" data-materi="2">
    <div class="japan-bg-container">
      <div class="lantern lantern-left">🏮</div>
      <div class="lantern lantern-right">🏮</div>
      <div class="cloud cloud-1">☁️</div>
      <div class="cloud cloud-2">☁️</div>
      <div class="sun-element"></div>
      <div class="sakura-branch">🌸</div>
      <div class="fuji-mountain"></div>
      <div class="torii-gate">⛩️</div>
      <div class="pagoda-tower">🏯</div>
      <div class="petals-wrapper">
        <span class="petal p1">🌸</span>
        <span class="petal p2">🌸</span>
        <span class="petal p3">🌸</span>
        <span class="petal p4">🌸</span>
      </div>
    </div>

    <main class="quiz-container">
      <header class="quiz-top">
        <a href="index.html" class="btn-menu">⬅ Menu</a>
        <span class="quiz-theme">Osaka Minitheme • 日本語の学習</span>
        <button type="button" class="btn-sound" id="btn-sound" title="Suara">🔊</button>
      </header>

      <div class="stats-pill">
        <div class="stat"><span class="stat-label">Skor</span><span class="stat-value" id="skor">0</span></div>
        <div class="stat"><span class="stat-label">Combo</span><span class="stat-value" id="combo">0×</span></div>
        <div class="stat"><span class="stat-label">Nyawa</span><span class="stat-value" id="nyawa"></span></div>
      </div>

      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>

      <section class="mascot-area">
        <div class="mascot-bubble" id="bubble">Ganbatte! Pilih jawaban yang tepat.</div>
        <div class="mascot-emoji" id="mascot">🐱</div>
      </section>

      <div class="badge-row">
        <span class="badge">Bunpou N4</span>
      </div>
      <p class="materi-info" id="materi-info"></p>

      <h2 class="question-text" id="pertanyaan"></h2>

      <div class="options-grid" id="opsi"></div>

      <div class="feedback-box" id="feedback" hidden></div>

      <div class="correction-box" id="koreksi" hidden></div>

      <nav class="quiz-nav">
        <button class="nav-btn" id="btn-prev">⬅ Sebelumnya</button>
        <span class="nav-counter" id="counter">Soal 1 / 10</span>
        <button class="nav-btn" id="btn-next">Berikutnya ➡</button>
      </nav>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <div class="overlay-emoji" id="hasil-emoji">🎉</div>
        <h3 id="hasil-judul">Selesai!</h3>
        <p id="hasil-teks"></p>
        <div class="overlay-actions">
          <button class="nav-btn" id="btn-tinjau">Tinjau Soal</button>
          <button class="nav-btn primary" id="btn-ulang">Ulangi 🔁</button>
          <a class="nav-btn" href="index.html">Menu</a>
        </div>
      </div>
    </div>

    <!-- PENTING: Pastikan script ini dimuat berurutan -->
    <script src="data-soal.js"></script>
    <script src="sound.js"></script>
    <script src="akses.js"></script>
    <script src="script-soal.js"></script>
  </body>
</html>
